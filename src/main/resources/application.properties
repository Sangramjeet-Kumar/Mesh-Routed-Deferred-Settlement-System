# Server
server.port=8080

# Persistent PostgreSQL. Supply credentials in the environment, never in source.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/upimesh}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:upimesh}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId:-none}] - %msg%n

# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.idempotency-store=redis
upi.mesh.redis.namespace=${REDIS_NAMESPACE:upimesh:demo}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400

# Required shared secret for external bridge uploads and metrics. Never send to React.
upi.mesh.bridge-api-key=${BRIDGE_API_KEY:}
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.jmx.exposure.exclude=*
