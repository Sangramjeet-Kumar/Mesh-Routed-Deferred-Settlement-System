# Tests remain isolated from any developer PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:upimesh-tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=false
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.idempotency-store=test
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
upi.mesh.packet-max-age-seconds=86400
upi.mesh.bridge-api-key=characterization-test-key-not-for-deployment
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
